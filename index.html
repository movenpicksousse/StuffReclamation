<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Entreprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>Connexion</h1>

  <p>Accédez à votre département</p>

  <input type="text" id="username" placeholder="Nom d'utilisateur">
  <small class="hint" >  Le nom d'utilisateur depend de votre departement</small>
  <input type="password" id="password" placeholder="Mot de passe">
  <small class="hint">Le mot de passe depend de votre departement </small>
  
  <button onclick="login()"> Se connecter </button>
  
  <p id="message"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
